<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简图片改字工具 - 点选即改 · 保持原图字体一致</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;700&display=swap');
    
    .font-yahei { font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
    .font-heiti { font-family: "SimHei", "黑体", "Noto Sans SC", sans-serif; }
    .font-songti { font-family: "SimSun", "宋体", "Noto Serif SC", serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", serif; }
    .font-fangsong { font-family: "FangSong", "仿宋", "STFangsong", serif; }
    .font-arial { font-family: Arial, "Helvetica Neue", sans-serif; }

    .checkerboard {
      background-color: #0f172a;
      background-image: 
        linear-gradient(45deg, #1e293b 25%, transparent 25%), 
        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    }

    /* 脉冲提示动画 */
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(99, 102, 241, 0.9); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
      50% { border-color: rgba(129, 140, 248, 1); box-shadow: 0 0 0 6px rgba(99, 102, 241, 0); }
    }
    .selection-active {
      animation: pulse-border 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden select-none font-sans">

  <!-- 顶部极简操作栏 -->
  <header class="h-14 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between px-5 z-30 flex-shrink-0 shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <i data-lucide="edit-3" class="w-4 h-4 text-white"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">极简图片改字工具</h1>
        <p class="text-[10px] text-indigo-300 font-medium">框选文字 ➔ 自动抹除原字 ➔ 直接打字改好</p>
      </div>
    </div>

    <!-- 顶部中央使用提示 -->
    <div class="hidden md:flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/60 text-xs text-slate-300">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>第一步：在图片上<b>鼠标拖拽框住要改的字</b>，松开即可直接打字修改</span>
    </div>

    <!-- 顶部右侧按钮 -->
    <div class="flex items-center space-x-2.5">
      <label class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium cursor-pointer flex items-center space-x-1.5 transition">
        <i data-lucide="upload" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>导入图片</span>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
      </label>

      <button id="btn-compare" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-medium flex items-center space-x-1 transition" title="按住对比原图" onmousedown="showOriginal(true)" onmouseup="showOriginal(false)" onmouseleave="showOriginal(false)" ontouchstart="showOriginal(true)" ontouchend="showOriginal(false)">
        <i data-lucide="eye" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>按住看原图</span>
      </button>

      <button onclick="undoLastAction()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition" title="撤销上一步 (Ctrl+Z)">
        <i data-lucide="undo-2" class="w-4 h-4"></i>
      </button>

      <button onclick="exportResult()" class="px-4 py-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white text-xs font-bold shadow-lg shadow-indigo-500/25 flex items-center space-x-1.5 transition active:scale-95">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>保存/导出图片</span>
      </button>
    </div>
  </header>

  <!-- 中间核心工作区 -->
  <main id="canvasWrapper" class="flex-1 overflow-hidden relative checkerboard flex items-center justify-center">

    <!-- 拖拽上传欢迎框 -->
    <div id="emptyDropzone" class="absolute inset-0 flex flex-col items-center justify-center p-6 z-20 transition-all bg-slate-950/85 backdrop-blur-sm" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
      <div class="max-w-md w-full bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-8 rounded-3xl flex flex-col items-center text-center shadow-2xl transition cursor-pointer group" onclick="document.getElementById('imageInput').click()">
        <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 group-hover:scale-110 flex items-center justify-center text-indigo-400 mb-4 transition duration-300">
          <i data-lucide="image-up" class="w-8 h-8"></i>
        </div>
        <h3 class="text-base font-bold text-white mb-1">点击或拖拽放入图片</h3>
        <p class="text-xs text-slate-400 mb-5">支持工牌、胸卡、活动证、证书模板、海报等任意图片</p>
        
        <div class="w-full pt-4 border-t border-slate-800/80 flex flex-col items-center space-y-2">
          <span class="text-[11px] text-slate-400">没有图片？点击下方样例立即试玩：</span>
          <div class="flex space-x-2">
            <button onclick="event.stopPropagation(); loadSample(1)" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-indigo-300 border border-slate-700 transition">
              🪪 员工工牌样例
            </button>
            <button onclick="event.stopPropagation(); loadSample(2)" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-indigo-300 border border-slate-700 transition">
              📜 培训证书样例
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 视口容器 -->
    <div id="viewport" class="relative transition-transform duration-75">
      <div id="canvasContainer" class="relative shadow-2xl rounded-lg border border-slate-800 overflow-hidden">
        <!-- 1. 底层原图画布 -->
        <canvas id="baseCanvas" class="block"></canvas>
        <!-- 2. 背景自动擦除修补层画布 -->
        <canvas id="inpaintCanvas" class="absolute inset-0 pointer-events-none"></canvas>
        <!-- 3. 文字重绘排版层画布 -->
        <canvas id="textCanvas" class="absolute inset-0 pointer-events-none"></canvas>
        <!-- 4. 交互操作层画布 -->
        <canvas id="interactionCanvas" class="absolute inset-0 cursor-crosshair"></canvas>
      </div>

      <!-- 悬浮即时编辑气泡条 (Floating Quick Toolbar) -->
      <div id="floatingEditor" class="absolute hidden z-40 bg-slate-900/95 backdrop-blur-md border border-indigo-500/50 p-2.5 rounded-2xl shadow-2xl flex flex-col space-y-2 text-xs transition-all duration-150" style="min-width: 320px;">
        <!-- 第一行：即时输入框 + 完成按钮 -->
        <div class="flex items-center space-x-2">
          <input type="text" id="floatInputText" placeholder="在此输入新文字..." class="flex-1 bg-slate-950 border border-indigo-500/40 rounded-xl px-3 py-2 text-xs font-medium text-white focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400" oninput="onFloatTextInput(this.value)" onkeydown="if(event.key==='Enter') closeFloatEditor()">
          <button onclick="closeFloatEditor()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition flex items-center space-x-1 shadow-md shadow-indigo-600/30">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span>完成</span>
          </button>
        </div>

        <!-- 第二行：极简快捷微调（字体、字号大/小、颜色、对齐、删除） -->
        <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-[11px]">
          <!-- 快速字体切换 -->
          <select id="floatFontFamily" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none" onchange="updateFloatProp('fontFamily', this.value)">
            <option value="'Microsoft YaHei', '微软雅黑', sans-serif">微软雅黑 (常用黑体)</option>
            <option value="'SimSun', '宋体', 'Noto Serif SC', serif">宋体 (正规证书)</option>
            <option value="'KaiTi', '楷体', serif">楷体 (荣誉毛笔感)</option>
            <option value="'FangSong', '仿宋', serif">仿宋</option>
            <option value="'Arial', sans-serif">Arial / 英文数字</option>
          </select>

          <!-- 字号微调 -->
          <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-0.5 space-x-1">
            <button onclick="adjustFloatFontSize(-2)" class="px-1.5 py-0.5 hover:bg-slate-800 rounded text-slate-300 font-bold" title="缩小字号">-</button>
            <span id="floatFontSizeLabel" class="w-7 text-center font-mono text-indigo-300 text-[10px]">32</span>
            <button onclick="adjustFloatFontSize(2)" class="px-1.5 py-0.5 hover:bg-slate-800 rounded text-slate-300 font-bold" title="放大字号">+</button>
          </div>

          <!-- 颜色选择 -->
          <div class="flex items-center space-x-1">
            <input type="color" id="floatColorPicker" class="w-6 h-6 rounded border border-slate-700 bg-transparent cursor-pointer" onchange="updateFloatProp('color', this.value)">
          </div>

          <!-- 加粗 -->
          <button id="floatBtnBold" onclick="toggleFloatProp('isBold')" class="p-1.5 rounded hover:bg-slate-800 text-slate-300" title="加粗">
            <i data-lucide="bold" class="w-3.5 h-3.5"></i>
          </button>

          <!-- 删除该项 -->
          <button onclick="deleteActiveLayer()" class="p-1.5 rounded hover:bg-red-950/60 text-slate-400 hover:text-red-400 transition" title="删除">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 画布底部缩放条 -->
    <div class="absolute bottom-4 bg-slate-900/90 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-full shadow-2xl flex items-center space-x-3 text-xs z-20">
      <button onclick="zoomCanvas(-0.1)" class="p-1 hover:text-indigo-400 text-slate-300 transition"><i data-lucide="zoom-out" class="w-3.5 h-3.5"></i></button>
      <span id="zoomLevelText" class="text-slate-300 font-mono text-[11px] w-10 text-center">100%</span>
      <button onclick="zoomCanvas(0.1)" class="p-1 hover:text-indigo-400 text-slate-300 transition"><i data-lucide="zoom-in" class="w-3.5 h-3.5"></i></button>
      <div class="h-3 w-[1px] bg-slate-700"></div>
      <button onclick="fitToScreen()" class="px-2 py-0.5 hover:text-indigo-400 text-slate-300 transition text-[11px]">适应窗口</button>
    </div>
  </main>

  <script>
    // 全局状态
    const state = {
      image: null,
      imageWidth: 0,
      imageHeight: 0,
      scale: 1,
      panX: 0,
      panY: 0,
      isDragging: false,
      startX: 0,
      startY: 0,
      currentBox: null,
      activeLayerId: null,
      layers: [], // 记录所有改字项
      history: []
    };

    const baseCanvas = document.getElementById('baseCanvas');
    const inpaintCanvas = document.getElementById('inpaintCanvas');
    const textCanvas = document.getElementById('textCanvas');
    const interactionCanvas = document.getElementById('interactionCanvas');

    const baseCtx = baseCanvas.getContext('2d');
    const inpaintCtx = inpaintCanvas.getContext('2d');
    const textCtx = textCanvas.getContext('2d');
    const interCtx = interactionCanvas.getContext('2d');

    const viewport = document.getElementById('viewport');
    const floatingEditor = document.getElementById('floatingEditor');
    const emptyDropzone = document.getElementById('emptyDropzone');

    lucide.createIcons();

    // 图片上传
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) loadImageFromFile(file);
    }

    function handleDrop(e) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImageFromFile(file);
    }

    function loadImageFromFile(file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => initWorkspace(img);
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function initWorkspace(img) {
      state.image = img;
      state.imageWidth = img.width;
      state.imageHeight = img.height;
      state.layers = [];
      state.activeLayerId = null;
      state.history = [];

      [baseCanvas, inpaintCanvas, textCanvas, interactionCanvas].forEach(c => {
        c.width = img.width;
        c.height = img.height;
      });

      baseCtx.clearRect(0, 0, img.width, img.height);
      baseCtx.drawImage(img, 0, 0);

      inpaintCtx.clearRect(0, 0, img.width, img.height);
      textCtx.clearRect(0, 0, img.width, img.height);
      interCtx.clearRect(0, 0, img.width, img.height);

      emptyDropzone.classList.add('hidden');
      closeFloatEditor();
      fitToScreen();
      renderAll();
    }

    // 缩放控制
    function zoomCanvas(d) {
      state.scale = Math.max(0.1, Math.min(4.0, state.scale + d));
      applyTransform();
    }

    function fitToScreen() {
      if (!state.image) return;
      const w = document.getElementById('canvasWrapper');
      const rw = (w.clientWidth - 60) / state.imageWidth;
      const rh = (w.clientHeight - 60) / state.imageHeight;
      state.scale = Math.min(1.0, Math.min(rw, rh));
      state.panX = 0;
      state.panY = 0;
      applyTransform();
    }

    function applyTransform() {
      viewport.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
      document.getElementById('zoomLevelText').innerText = `${Math.round(state.scale * 100)}%`;
      if (state.activeLayerId) positionFloatEditor(getActiveLayer());
    }

    // 鼠标交互：框选文字 -> 自动执行擦除 + 取样 + 弹出即时输入条
    interactionCanvas.addEventListener('mousedown', (e) => {
      if (!state.image) return;
      const pt = getCanvasPos(e);

      // 检查是否点击了已有文字项
      const clicked = state.layers.find(l => pt.x >= l.x && pt.x <= l.x + l.w && pt.y >= l.y && pt.y <= l.y + l.h);
      if (clicked) {
        openFloatEditorForLayer(clicked);
        return;
      }

      state.isDragging = true;
      state.startX = pt.x;
      state.startY = pt.y;
      state.currentBox = { x: pt.x, y: pt.y, w: 0, h: 0 };
    });

    window.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      const pt = getCanvasPos(e);
      const minX = Math.min(state.startX, pt.x);
      const minY = Math.min(state.startY, pt.y);
      const w = Math.abs(pt.x - state.startX);
      const h = Math.abs(pt.y - state.startY);
      state.currentBox = { x: minX, y: minY, w, h };
      renderInteraction();
    });

    window.addEventListener('mouseup', () => {
      if (!state.isDragging) return;
      state.isDragging = false;
      const box = state.currentBox;
      state.currentBox = null;
      renderInteraction();

      if (box && box.w > 12 && box.h > 10) {
        // 1. 自动执行底图抹除
        inpaintBoxArea(box);
        // 2. 自动取样原字色与字号
        const sample = sampleBoxAttributes(box);
        // 3. 创建新修改层
        const layer = {
          id: 'layer_' + Date.now(),
          text: '输入新文字',
          x: box.x,
          y: box.y,
          w: box.w,
          h: box.h,
          fontFamily: sample.fontFamily,
          fontSize: sample.fontSize,
          color: sample.color,
          isBold: sample.isBold,
          align: 'center'
        };
        state.layers.push(layer);
        state.history.push(JSON.stringify(state.layers));
        renderAll();
        // 4. 立即弹出悬浮输入框聚焦打字
        openFloatEditorForLayer(layer);
      }
    });

    function getCanvasPos(e) {
      const rect = interactionCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (state.imageWidth / rect.width);
      const y = (e.clientY - rect.top) * (state.imageHeight / rect.height);
      return { x, y };
    }

    // 智能底图擦除修复 (平滑扩散背景)
    function inpaintBoxArea(box) {
      const pad = 3;
      const bx = Math.floor(Math.max(0, box.x - pad));
      const by = Math.floor(Math.max(0, box.y - pad));
      const bw = Math.floor(Math.min(state.imageWidth - bx, box.w + pad * 2));
      const bh = Math.floor(Math.min(state.imageHeight - by, box.h + pad * 2));
      if (bw <= 0 || bh <= 0) return;

      const topData = baseCtx.getImageData(bx, Math.max(0, by - 2), bw, 2).data;
      const bottomData = baseCtx.getImageData(bx, Math.min(state.imageHeight - 2, by + bh), bw, 2).data;
      const leftData = baseCtx.getImageData(Math.max(0, bx - 2), by, 2, bh).data;
      const rightData = baseCtx.getImageData(Math.min(state.imageWidth - 2, bx + bw), by, 2, bh).data;

      const patch = inpaintCtx.createImageData(bw, bh);
      const d = patch.data;

      for (let y = 0; y < bh; y++) {
        const v = y / bh;
        for (let x = 0; x < bw; x++) {
          const u = x / bw;
          const idx = (y * bw + x) * 4;

          const tIdx = (Math.floor(x) % bw) * 4;
          const bIdx = (Math.floor(x) % bw) * 4;
          const rV = topData[tIdx] * (1 - v) + bottomData[bIdx] * v;
          const gV = topData[tIdx + 1] * (1 - v) + bottomData[bIdx + 1] * v;
          const bV = topData[tIdx + 2] * (1 - v) + bottomData[bIdx + 2] * v;

          const lIdx = (Math.floor(y) % bh) * 4;
          const rIdx = (Math.floor(y) % bh) * 4;
          const rH = leftData[lIdx] * (1 - u) + rightData[rIdx] * u;
          const gH = leftData[lIdx + 1] * (1 - u) + rightData[rIdx + 1] * u;
          const bH = leftData[lIdx + 2] * (1 - u) + rightData[rIdx + 2] * u;

          d[idx] = (rV + rH) / 2;
          d[idx + 1] = (gV + gH) / 2;
          d[idx + 2] = (bV + bH) / 2;
          d[idx + 3] = 255;
        }
      }
      inpaintCtx.putImageData(patch, bx, by);
    }

    // 智能提取原字色与尺寸
    function sampleBoxAttributes(box) {
      const bx = Math.floor(Math.max(0, box.x));
      const by = Math.floor(Math.max(0, box.y));
      const bw = Math.floor(Math.min(state.imageWidth - bx, box.w));
      const bh = Math.floor(Math.min(state.imageHeight - by, box.h));
      
      let sampledColor = '#111827';
      if (bw > 0 && bh > 0) {
        const imgData = baseCtx.getImageData(bx, by, bw, bh).data;
        let bins = {};
        for (let i = 0; i < imgData.length; i += 16) {
          const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
          const qr = Math.round(r / 20) * 20;
          const qg = Math.round(g / 20) * 20;
          const qb = Math.round(b / 20) * 20;
          const k = `${qr},${qg},${qb}`;
          bins[k] = (bins[k] || 0) + 1;
        }
        const sorted = Object.entries(bins).sort((a,b) => b[1] - a[1]);
        if (sorted.length > 1) {
          const [r, g, b] = sorted[1][0].split(',').map(Number);
          sampledColor = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
      }

      return {
        fontFamily: "'Microsoft YaHei', '微软雅黑', sans-serif",
        fontSize: Math.max(12, Math.round(bh * 0.72)),
        color: sampledColor,
        isBold: true
      };
    }

    // 悬浮即时编辑框交互
    function openFloatEditorForLayer(layer) {
      state.activeLayerId = layer.id;
      const input = document.getElementById('floatInputText');
      input.value = layer.text;
      document.getElementById('floatFontFamily').value = layer.fontFamily;
      document.getElementById('floatFontSizeLabel').innerText = layer.fontSize;
      document.getElementById('floatColorPicker').value = layer.color;

      const boldBtn = document.getElementById('floatBtnBold');
      if (layer.isBold) boldBtn.classList.add('bg-indigo-600', 'text-white');
      else boldBtn.classList.remove('bg-indigo-600', 'text-white');

      positionFloatEditor(layer);
      floatingEditor.classList.remove('hidden');
      setTimeout(() => { input.focus(); input.select(); }, 50);
      renderInteraction();
    }

    function positionFloatEditor(layer) {
      if (!layer) return;
      const canvasRect = interactionCanvas.getBoundingClientRect();
      const parentRect = document.getElementById('canvasWrapper').getBoundingClientRect();

      const scale = canvasRect.width / state.imageWidth;
      let left = (canvasRect.left - parentRect.left) + layer.x * scale;
      let top = (canvasRect.top - parentRect.top) + (layer.y + layer.h) * scale + 10;

      // 防止溢出边界
      if (top + 100 > parentRect.height) {
        top = (canvasRect.top - parentRect.top) + layer.y * scale - 95;
      }
      left = Math.max(10, Math.min(parentRect.width - 340, left));

      floatingEditor.style.left = `${left}px`;
      floatingEditor.style.top = `${top}px`;
    }

    function closeFloatEditor() {
      floatingEditor.classList.add('hidden');
      state.activeLayerId = null;
      renderInteraction();
    }

    function onFloatTextInput(val) {
      const layer = getActiveLayer();
      if (!layer) return;
      layer.text = val;
      renderAll();
    }

    function updateFloatProp(key, val) {
      const layer = getActiveLayer();
      if (!layer) return;
      layer[key] = val;
      renderAll();
    }

    function toggleFloatProp(key) {
      const layer = getActiveLayer();
      if (!layer) return;
      layer[key] = !layer[key];
      const boldBtn = document.getElementById('floatBtnBold');
      if (layer.isBold) boldBtn.classList.add('bg-indigo-600', 'text-white');
      else boldBtn.classList.remove('bg-indigo-600', 'text-white');
      renderAll();
    }

    function adjustFloatFontSize(delta) {
      const layer = getActiveLayer();
      if (!layer) return;
      layer.fontSize = Math.max(8, layer.fontSize + delta);
      document.getElementById('floatFontSizeLabel').innerText = layer.fontSize;
      renderAll();
    }

    function deleteActiveLayer() {
      if (!state.activeLayerId) return;
      state.layers = state.layers.filter(l => l.id !== state.activeLayerId);
      closeFloatEditor();
      renderAll();
    }

    function getActiveLayer() {
      return state.layers.find(l => l.id === state.activeLayerId);
    }

    function undoLastAction() {
      if (state.layers.length > 0) {
        state.layers.pop();
        closeFloatEditor();
        renderAll();
      }
    }

    // 渲染排版与文字
    function renderAll() {
      if (!state.image) return;
      textCtx.clearRect(0, 0, state.imageWidth, state.imageHeight);

      state.layers.forEach(l => {
        textCtx.save();
        const weight = l.isBold ? 'bold' : 'normal';
        textCtx.font = `${weight} ${l.fontSize}px ${l.fontFamily}`;
        textCtx.fillStyle = l.color;
        textCtx.textAlign = 'center';
        textCtx.textBaseline = 'middle';

        // 绘制在选框正中心
        const cx = l.x + l.w / 2;
        const cy = l.y + l.h / 2;
        textCtx.fillText(l.text, cx, cy);
        textCtx.restore();
      });

      renderInteraction();
    }

    function renderInteraction() {
      interCtx.clearRect(0, 0, state.imageWidth, state.imageHeight);

      // 正在拖拽的框
      if (state.currentBox) {
        const b = state.currentBox;
        interCtx.strokeStyle = '#6366f1';
        interCtx.lineWidth = 2 / state.scale;
        interCtx.setLineDash([4 / state.scale, 4 / state.scale]);
        interCtx.strokeRect(b.x, b.y, b.w, b.h);
        interCtx.fillStyle = 'rgba(99, 102, 241, 0.15)';
        interCtx.fillRect(b.x, b.y, b.w, b.h);
        interCtx.setLineDash([]);
      }

      // 当前激活的文字边框
      const active = getActiveLayer();
      if (active) {
        interCtx.strokeStyle = '#38bdf8';
        interCtx.lineWidth = 1.5 / state.scale;
        interCtx.strokeRect(active.x, active.y, active.w, active.h);
      }
    }

    function showOriginal(show) {
      if (!state.image) return;
      inpaintCanvas.style.opacity = show ? '0' : '1';
      textCanvas.style.opacity = show ? '0' : '1';
    }

    function exportResult() {
      if (!state.image) {
        alert('请先导入图片！');
        return;
      }
      const offscreen = document.createElement('canvas');
      offscreen.width = state.imageWidth;
      offscreen.height = state.imageHeight;
      const ctx = offscreen.getContext('2d');
      ctx.drawImage(baseCanvas, 0, 0);
      ctx.drawImage(inpaintCanvas, 0, 0);
      ctx.drawImage(textCanvas, 0, 0);

      const a = document.createElement('a');
      a.download = `改字完成_${Date.now()}.png`;
      a.href = offscreen.toDataURL('image/png', 1.0);
      a.click();
    }

    // 预置样例
    function loadSample(type) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');

      if (type === 1) {
        // 员工工牌样例
        c.width = 600;
        c.height = 900;

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, 600, 900);

        // 头部蓝底
        ctx.fillStyle = '#1e40af';
        ctx.fillRect(0, 0, 600, 220);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.fillText('科技创新有限公司 · 工作证', 300, 120);

        // 头像占位框
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(210, 260, 180, 220);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '16px "Microsoft YaHei"';
        ctx.fillText('照片区域', 300, 380);

        // 姓名
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 36px "Microsoft YaHei"';
        ctx.fillText('李明浩', 300, 540);

        // 职务
        ctx.fillStyle = '#475569';
        ctx.font = '20px "Microsoft YaHei"';
        ctx.fillText('高级系统架构师', 300, 600);

        // 编号与日期
        ctx.fillStyle = '#64748b';
        ctx.font = '16px Arial';
        ctx.fillText('工号: NO. 20268892', 300, 660);
        ctx.fillText('有效日期: 2026.12.31', 300, 700);

        // 底部条形装饰
        ctx.fillStyle = '#1e40af';
        ctx.fillRect(0, 860, 600, 40);
      } else {
        // 培训结业证书样例
        c.width = 900;
        c.height = 620;

        ctx.fillStyle = '#fefce8';
        ctx.fillRect(0, 0, 900, 620);

        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 10;
        ctx.strokeRect(30, 30, 840, 560);
        ctx.lineWidth = 2;
        ctx.strokeRect(45, 45, 810, 530);

        ctx.fillStyle = '#854d0e';
        ctx.font = 'bold 44px "SimSun", "宋体"';
        ctx.textAlign = 'center';
        ctx.fillText('培 训 结 业 证 书', 450, 150);

        ctx.fillStyle = '#1c1917';
        ctx.font = '24px "KaiTi", "楷体"';
        ctx.fillText('兹证明 王海燕 学员：', 300, 260);
        ctx.fillText('已圆满完成 2026 年度企业数字化转型高级研修班 全部课程，准予结业。', 450, 340);

        ctx.fillStyle = '#78716c';
        ctx.font = '18px "SimSun", "宋体"';
        ctx.fillText('证书编号: EDU-2026-0988', 280, 480);
        ctx.fillText('发证日期: 2026 年 10 月', 620, 480);
      }

      const img = new Image();
      img.onload = () => initWorkspace(img);
      img.src = c.toDataURL();
    }
  </script>
